<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 720" width="760" height="720">
<defs>
  <style>
    text { font-family: -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; }
    .mono { font-family: 'SF Mono', Menlo, Consolas, monospace; }
  </style>
  <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1D4ED8"/><stop offset="100%" stop-color="#60A5FA"/></linearGradient>
  <linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#C2410C"/><stop offset="100%" stop-color="#FB923C"/></linearGradient>
  <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#15803D"/><stop offset="100%" stop-color="#4ADE80"/></linearGradient>
  <linearGradient id="gPurple" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#6D28D9"/><stop offset="100%" stop-color="#A78BFA"/></linearGradient>
  <linearGradient id="gSlate" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#475569"/><stop offset="100%" stop-color="#94A3B8"/></linearGradient>
  <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0F766E"/><stop offset="100%" stop-color="#2DD4BF"/></linearGradient>
  <filter id="shadowSm"><feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#64748B" flood-opacity="0.12"/></filter>
  <marker id="arr_gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#94A3B8"/></marker>
  <marker id="arr_green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#22C55E"/></marker>
  <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3B82F6"/></marker>
  <marker id="arr_orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#F97316"/></marker>
  <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#EF4444"/></marker>
</defs>
<rect width="760" height="720" fill="#F8FAFC"/>
<text x="380" y="48" font-size="26" font-weight="800" fill="#0F172A" text-anchor="middle">上下文窗口里装了什么</text>
<text x="380" y="76" font-size="14" font-weight="400" fill="#64748B" text-anchor="middle">每一轮,模型看到的就是下面这一摞,而窗口是有限的</text>
<rect x="40" y="108" width="430" height="150" rx="12" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5" filter="url(#shadowSm)"/>
<text x="58" y="136" font-size="14.5" font-weight="700" fill="#1E40AF" text-anchor="start">系统提示词 · 稳定前缀</text>
<text x="58" y="162" font-size="12.5" font-weight="400" fill="#1E3A8A" text-anchor="start">基础指令</text>
<text x="58" y="184" font-size="12.5" font-weight="400" fill="#1E3A8A" text-anchor="start">工作区文件:AGENTS.md、MEMORY.md ……</text>
<text x="58" y="206" font-size="12.5" font-weight="400" fill="#1E3A8A" text-anchor="start">每个文件最多 2 万字符,合计最多 6 万字符</text>
<text x="58" y="236" font-size="12.5" font-weight="700" fill="#1E3A8A" text-anchor="start">每轮基本不变,所以能命中 prompt cache</text>
<line x1="40" y1="274" x2="470" y2="274" stroke="#EF4444" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="105" y="262" width="300" height="24" rx="12" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
<text class="mono" x="255.0" y="278.5" font-size="11" font-weight="400" fill="#B91C1C" text-anchor="middle">OPENCLAW_CACHE_BOUNDARY</text>
<rect x="40" y="296" width="430" height="100" rx="12" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5" filter="url(#shadowSm)"/>
<text x="58" y="324" font-size="14.5" font-weight="700" fill="#9A3412" text-anchor="start">系统提示词 · 动态后缀</text>
<text x="58" y="350" font-size="12.5" font-weight="400" fill="#7C2D12" text-anchor="start">当前时间、消息渠道、群聊上下文、运行时 ……</text>
<text x="58" y="376" font-size="12.5" font-weight="700" fill="#7C2D12" text-anchor="start">每轮可能变,所以放在边界之后</text>
<rect x="40" y="412" width="430" height="150" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5" filter="url(#shadowSm)"/>
<text x="58" y="440" font-size="14.5" font-weight="700" fill="#166534" text-anchor="start">对话转录</text>
<rect x="58" y="456" width="80" height="28" rx="14" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1"/>
<text x="98.0" y="474.5" font-size="12" font-weight="400" fill="#166534" text-anchor="middle">用户消息</text>
<rect x="146" y="456" width="104" height="28" rx="14" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1"/>
<text x="198.0" y="474.5" font-size="12" font-weight="400" fill="#166534" text-anchor="middle">assistant 回复</text>
<rect x="258" y="456" width="80" height="28" rx="14" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1"/>
<text x="298.0" y="474.5" font-size="12" font-weight="400" fill="#166534" text-anchor="middle">工具调用</text>
<rect x="346" y="456" width="96" height="28" rx="14" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
<text x="394.0" y="474.5" font-size="12" font-weight="400" fill="#B91C1C" text-anchor="middle">工具结果</text>
<text x="58" y="512" font-size="12.5" font-weight="700" fill="#14532D" text-anchor="start">越聊越长,窗口迟早装不下</text>
<text x="58" y="534" font-size="12.5" font-weight="400" fill="#14532D" text-anchor="start">工具结果体积大,是裁剪盯的对象</text>
<rect x="494" y="108" width="226" height="108" rx="12" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5" filter="url(#shadowSm)"/>
<text x="512" y="136" font-size="14" font-weight="700" fill="#5B21B6" text-anchor="start">同样占窗口的</text>
<text x="512" y="162" font-size="12.5" font-weight="400" fill="#4C1D95" text-anchor="start">工具定义的 JSON schema</text>
<text x="512" y="186" font-size="12.5" font-weight="400" fill="#4C1D95" text-anchor="start">skill 条目</text>
<rect x="494" y="232" width="226" height="330" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadowSm)"/>
<text x="512" y="260" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start">/context 看得见</text>
<text class="mono" x="512" y="290" font-size="12.5" font-weight="700" fill="#1E40AF" text-anchor="start">/context list</text>
<text x="512" y="312" font-size="12" font-weight="400" fill="#475569" text-anchor="start">各部分大致多大</text>
<text class="mono" x="512" y="346" font-size="12.5" font-weight="700" fill="#1E40AF" text-anchor="start">/context detail</text>
<text x="512" y="368" font-size="12" font-weight="400" fill="#475569" text-anchor="start">每个文件、每个工具</text>
<text x="512" y="388" font-size="12" font-weight="400" fill="#475569" text-anchor="start">schema、每个 skill</text>
<text x="512" y="408" font-size="12" font-weight="400" fill="#475569" text-anchor="start">各自的大小</text>
<text class="mono" x="512" y="442" font-size="12.5" font-weight="700" fill="#1E40AF" text-anchor="start">/context map</text>
<text x="512" y="464" font-size="12" font-weight="400" fill="#475569" text-anchor="start">按字符面积画的树图,</text>
<text x="512" y="484" font-size="12" font-weight="400" fill="#475569" text-anchor="start">一眼看出谁占得多</text>
<rect x="40" y="586" width="680" height="110" rx="12" fill="#0F172A" stroke="#0F172A" stroke-width="1" filter="url(#shadowSm)"/>
<text x="64" y="616" font-size="14" font-weight="700" fill="#FBBF24" text-anchor="start">先记住这一摞</text>
<text x="64" y="644" font-size="13" font-weight="400" fill="#E2E8F0" text-anchor="start">裁剪盯的是工具结果,压缩处理的是整段旧对话。</text>
<text x="64" y="666" font-size="13" font-weight="400" fill="#E2E8F0" text-anchor="start">稳定前缀每轮不变,才能命中 prompt cache,后缀的变化不会连累它。</text>
</svg>
